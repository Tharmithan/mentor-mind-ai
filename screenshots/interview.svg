<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#0f0a1e"/>
  <text x="48" y="56" fill="#fff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">AI Interview Coach</text>
  <text x="48" y="84" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">Behavioral · Question 2 of 3</text>
  <rect x="48" y="110" width="700" height="200" rx="16" fill="#1e1b4b" stroke="#7c3aed33"/>
  <text x="72" y="160" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="12" font-weight="600">QUESTION</text>
  <text x="72" y="200" fill="#fff" font-family="system-ui,sans-serif" font-size="18">Tell me about a time you worked in a team</text>
  <text x="72" y="230" fill="#fff" font-family="system-ui,sans-serif" font-size="18">under pressure. What was your role?</text>
  <rect x="48" y="330" width="700" height="160" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="72" y="370" fill="#64748b" font-family="system-ui,sans-serif" font-size="12">YOUR ANSWER</text>
  <text x="72" y="400" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="14">In my capstone project I coordinated four teammates,</text>
  <text x="72" y="424" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="14">set weekly sprints, and we delivered on deadline&</text>
  <rect x="72" y="460" width="120" height="32" rx="8" fill="#7c3aed"/>
  <text x="132" y="481" fill="#fff" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Submit</text>
  <rect x="780" y="110" width="372" height="380" rx="16" fill="#1e1b4b" stroke="#7c3aed33"/>
  <text x="800" y="150" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Live Feedback</text>
  <text x="800" y="190" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Overall Score</text>
  <text x="800" y="230" fill="#34d399" font-family="system-ui,sans-serif" font-size="32" font-weight="700">4.2 / 5</text>
  <text x="800" y="280" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Communication: 4.5</text>
  <text x="800" y="310" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Confidence: 78%</text>
  <text x="800" y="340" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Engagement: High</text>
  <rect x="800" y="370" width="320" height="80" rx="8" fill="#0f172a"/>
  <text x="816" y="400" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13">Strong STAR structure. Add a</text>
  <text x="816" y="424" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13">specific metric to strengthen impact.</text>
  <text x="1100" y="660" fill="#64748b" font-family="system-ui,sans-serif" font-size="11" text-anchor="end">/interview</text>
</svg>
