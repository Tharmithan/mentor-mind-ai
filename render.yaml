# Render blueprint — backend API (frontend deploy separately on Vercel)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mentormind-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: ML_MODELS_DIR
        value: /app/ml-models
      - key: AUTO_CREATE_TABLES
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
        optional: true
